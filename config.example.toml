# Slat Configuration
# Place this file at ~/.config/slat/config.toml

# The main prefix key for all commands.
# Use "C-a", "C-b", "C-s", etc. for Ctrl key combinations.
# Mistakes in this file are reported when you run slat.
prefix = "C-s"

# Shell to launch (defaults to $SHELL or /bin/sh)
shell = "/bin/bash"

# Show the status bar at the bottom
status_bar = true

# Lines of output each pane keeps for scroll mode (0 turns it off)
scrollback = 2000

# The mouse: click a pane to focus it, and the wheel scrolls its history.
# Programs that ask for the mouse themselves (vim, htop, less) get the
# events instead, with the coordinates translated to their pane.
#
# While this is on, your terminal gives its clicks to slat, so its own
# click-drag selection is unavailable -- hold Shift to get it back in most
# terminals, or set this to false and use copy mode instead.
mouse = true

# Bring the session back after a reboot. slat saves the shape of the
# session -- workspaces, tabs, layout, each pane's directory -- and what
# each pane had printed, then restores it the next time it starts.
#
# What comes back is the output, not the programs: nothing portable can
# restore a running process, so each pane is a fresh shell in the same
# directory with its old output above the prompt. Quitting with q clears
# the saved session; detaching and rebooting do not.
restore = true

# Animations. Only the drawing is animated — panes are their final size
# throughout, so no program is resized more than once.
animations = true         # false turns every animation off
[animation]
split  = "90ms"           # a new pane appearing; 0 turns it off
move   = "120ms"          # two panes trading places
easing = "out-cubic"      # linear, out-quad, out-cubic, out-back
reveal = "curtain"        # how a new pane appears: curtain or none
glyph  = "░"              # the curtain's character

# What happens to text you copy in scroll mode with `y`.
[copy]
# Ask the terminal to put it on the system clipboard (OSC 52). This is the
# only method that works over ssh, because the clipboard is on your
# machine, not on the one slat runs on.
osc52 = true
# Optionally pipe it to a local program as well, for terminals that refuse
# OSC 52: "wl-copy", "xclip -selection clipboard", "pbcopy".
# command = ""

# Colours for the parts slat draws: the status bar, pane borders and
# overlays. Programs running in panes keep their own colours.
[theme]
# A palette to start from: default, gruvbox, nord, rose-pine, mono
name = "default"
# Override any single colour: a name (red, bright-blue), a palette index
# (0-255) or #rrggbb.
# bg            = 235
# fg            = 252
# dim           = 248
# accent        = "#00d7d7"   # workspace name, focused border, badges
# border        = 240
# tab_bg        = 236
# tab_fg        = 250
# tab_active_bg = 25
# tab_active_fg = 231

# The lines between panes.
[borders]
style = "sharp"           # sharp, rounded, heavy, double, dashed, none
# Or set any glyph yourself; each must be one column wide.
# vertical = "┃"
# horizontal = "━"
# top_left = "┏"
# top_right = "┓"
# bottom_left = "┗"
# bottom_right = "┛"
# tee_right = "┣"
# tee_left = "┫"
# tee_down = "┳"
# tee_up = "┻"
# cross = "╋"

# The status bar's layout. Placeholders for left and right: {workspace}
# {workspace_index} {workspace_count} {workspaces} {tabs} {tab} {tabs_count}
# {pane} {panes} {badge} {time} {seconds} {date}. In tab: {index} {name}
# {alert}. Everything else is literal text — put a Nerd Font glyph in if
# your terminal's font has one.
[status]
left  = " {workspace} │ {tabs}"
right = "{badge}{workspaces} pane {pane}/{panes} "
tab   = " {index}:{name}{alert} "
alert = " ?"               # marks a tab whose pane is waiting for input

# How `slat status`, `slat ls` and `slat wait` read a pane, for scripts and
# AI agents. See the README's "Scripting and agents" section.
[agent]
# A pane whose shell has been quiet this long is reported as idle.
settle = "750ms"
# A running program quiet this long on a prompt is reported as waiting
# for input.
input_after = "10s"
# Run a command when a pane starts waiting for input, or goes idle.
# %p pane id, %t tab, %s status, %c the pane's last line — all shell-quoted.
# on_input = 'notify-send "slat: pane %p needs input" %c'
# on_idle  = ""

# The prompts that count: regular expressions matched against the
# pane's last line. Setting this replaces the built-in list.
# input_patterns = ['\[[yY]/[nN]\]', '(?i)press enter', '\?\s*$']

# Keybindings (activated after pressing the prefix key)
# All keybinds are single characters pressed AFTER the prefix key.
# Set only the ones you want to change; the rest keep their defaults.
# Giving a default's key to another command unbinds the default.
# "" unbinds a command. 1-9 jump to tab N, ? shows help, and the
# arrow keys select panes.
[keybinds]
# ── Panes ──
split-vertical   = "v"    # Split pane left/right
split-horizontal = "h"    # Split pane top/bottom
next-pane        = "o"    # Cycle focus to next pane
prev-pane        = "O"    # Cycle focus to previous pane
select-pane-up   = "k"    # Focus pane above
select-pane-down = "j"    # Focus pane below
select-pane-left = "H"    # Focus pane to the left
select-pane-right= "L"    # Focus pane to the right
swap-pane        = "s"    # Swap active pane with the next one
move-mode        = "m"    # Walk the pane around with hjkl (q leaves)
move-pane-left   = "<"    # Swap with the neighbour on that side
move-pane-right  = ">"
move-pane-up     = "K"
move-pane-down   = "J"
resize-grow      = "+"    # Grow the active pane
resize-shrink    = "-"    # Shrink the active pane
equalize         = "="    # Reset all pane sizes to equal
close-pane       = "x"    # Close the active pane
zoom             = "z"    # Toggle zoom (fullscreen) for active pane
scroll-mode      = "["    # Scroll back through output (q to leave)

# ── Tabs ──
new-tab          = "c"    # Create a new tab
next-tab         = "n"    # Switch to next tab
prev-tab         = "p"    # Switch to previous tab
rename-tab       = ","    # Rename the current tab
close-tab        = "X"    # Close the entire tab (all panes)

# ── Workspaces ──
new-workspace    = "W"    # Create a new workspace
next-workspace   = "w"    # Switch to next workspace
prev-workspace   = "P"    # Switch to previous workspace
rename-workspace = "$"    # Rename the current workspace

# ── Session ──
quit             = "q"    # Quit slat
detach           = "d"    # Detach: disconnect, keep the session running
