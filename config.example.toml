# Slat Configuration
# Place this file at ~/.config/slat/config.toml

# The main prefix key for all commands.
# Use "C-a", "C-b", "C-s", etc. for Ctrl key combinations.
# Mistakes in this file are reported when you run slat.
prefix = "C-s"

# Shell to launch (defaults to $SHELL or /bin/sh)
shell = "/bin/bash"

# Show the status bar at the bottom
status_bar = true

# Lines of output each pane keeps for scroll mode (0 turns it off)
scrollback = 2000

# How `slat status`, `slat ls` and `slat wait` read a pane, for scripts and
# AI agents. See the README's "Scripting and agents" section.
[agent]
# A pane whose shell has been quiet this long is reported as idle.
settle = "750ms"
# A running program quiet this long on a prompt is reported as waiting
# for input.
input_after = "10s"
# Run a command when a pane starts waiting for input, or goes idle.
# %p pane id, %t tab, %s status, %c the pane's last line — all shell-quoted.
# on_input = 'notify-send "slat: pane %p needs input" %c'
# on_idle  = ""

# The prompts that count: regular expressions matched against the
# pane's last line. Setting this replaces the built-in list.
# input_patterns = ['\[[yY]/[nN]\]', '(?i)press enter', '\?\s*$']

# Keybindings (activated after pressing the prefix key)
# All keybinds are single characters pressed AFTER the prefix key.
# Set only the ones you want to change; the rest keep their defaults.
# Giving a default's key to another command unbinds the default.
# "" unbinds a command. 1-9 jump to tab N, ? shows help, and the
# arrow keys select panes.
[keybinds]
# ── Panes ──
split-vertical   = "v"    # Split pane left/right
split-horizontal = "h"    # Split pane top/bottom
next-pane        = "o"    # Cycle focus to next pane
prev-pane        = "O"    # Cycle focus to previous pane
select-pane-up   = "k"    # Focus pane above
select-pane-down = "j"    # Focus pane below
select-pane-left = "H"    # Focus pane to the left
select-pane-right= "L"    # Focus pane to the right
swap-pane        = "s"    # Swap active pane with the next one
resize-grow      = "+"    # Grow the active pane
resize-shrink    = "-"    # Shrink the active pane
equalize         = "="    # Reset all pane sizes to equal
close-pane       = "x"    # Close the active pane
zoom             = "z"    # Toggle zoom (fullscreen) for active pane
scroll-mode      = "["    # Scroll back through output (q to leave)

# ── Tabs ──
new-tab          = "c"    # Create a new tab
next-tab         = "n"    # Switch to next tab
prev-tab         = "p"    # Switch to previous tab
rename-tab       = ","    # Rename the current tab
close-tab        = "X"    # Close the entire tab (all panes)

# ── Workspaces ──
new-workspace    = "W"    # Create a new workspace
next-workspace   = "w"    # Switch to next workspace
prev-workspace   = "P"    # Switch to previous workspace
rename-workspace = "$"    # Rename the current workspace

# ── Session ──
quit             = "q"    # Quit slat
detach           = "d"    # Detach: disconnect, keep the session running
