# Nord Arctic — cool Nordic palette, rounded borders, and distinct glyph sets.
# Copy to ~/.config/slat/config.toml to use.

prefix      = "C-s"
status_bar  = true
auto_rename = true
mouse       = true
restore     = true
animations  = true

[animation]
split  = "95ms"
move   = "115ms"
easing = "out-quad"
reveal = "curtain"
glyph  = "·"

[splash]
enabled  = true
duration = "600ms"
subtitle = "nord arctic · {version}"
hint     = "{prefix} ? keys · {prefix} i pane IDs"

[theme]
name = "nord"

[borders]
style = "rounded"

[status]
left           = "{prefix} {fg=bg,bg=accent,bold} {workspace} {/} {tabs}"
right          = "{script:git} {badge}{workspaces} {fg=dim}{pane}/{panes}{/} {fg=accent}{time}{/} "
tab            = " {tab_index_glyph} {name} {current_pane_glyph}{alert} "
tab_active     = "{fg=tab_active_fg,bg=tab_active_bg,bold} {tab_index_glyph} {name} {current_pane_id_glyph}{alert} {/}"
tab_sep        = " "
alert          = "{fg=red,bold} ●{/}"
prefix         = "{fg=dim,bg=tab_bg}  {/}"
prefix_active  = "{fg=bg,bg=accent,bold} ❄ {/}"
pane_id        = "{fg=tab_fg,bg=tab_bg} #{id} {/}"
pane_id_active = "{fg=bg,bg=accent,bold} #{id} {/}"
tab_index_glyphs            = ["0", "ⅰ", "ⅱ", "ⅲ", "ⅳ", "ⅴ", "ⅵ", "ⅶ", "ⅷ", "ⅸ"]
current_pane_glyphs         = ["𝟢", "𝟣", "𝟤", "𝟥", "𝟦", "𝟧", "𝟨", "𝟩", "𝟪", "𝟫"]
current_pane_zoom_glyphs    = ["0", "⑴", "⑵", "⑶", "⑷", "⑸", "⑹", "⑺", "⑻", "⑼"]
current_pane_id_glyphs      = ["0", "⒈", "⒉", "⒊", "⒋", "⒌", "⒍", "⒎", "⒏", "⒐"]
current_pane_id_zoom_glyphs = ["𝟶", "𝟷", "𝟸", "𝟹", "𝟺", "𝟻", "𝟼", "𝟽", "𝟾", "𝟿"]

[status.scripts.git]
command  = "git -C \"$SLAT_PANE_CWD\" branch --show-current 2>/dev/null | sed 's/.*/{fg=accent}⌥ &{\\/}/'"
interval = "5s"
timeout  = "2s"
fallback = ""

[shortcuts]
"Alt+1" = "~/.config/slat/scripts/save-note.sh"
