# Vice City — 80s Miami synthwave (sunset pink, Miami cyan, twilight indigo).
# Copy to ~/.config/slat/config.toml to use.

prefix      = "C-s"
status_bar  = true
auto_rename = true
animations  = true

[animation]
split  = "120ms"
move   = "140ms"
easing = "out-back"
reveal = "curtain"
glyph  = "░"

[splash]
enabled  = true
duration = "700ms"
subtitle = "VICE CITY · {version}"
hint     = "press {prefix} ? for help"

[theme]
name = "vice-city"

[borders]
style = "double"

[status]
left           = "{prefix} {fg=bg,bg=accent,bold} {workspace} {/} {tabs}"
right          = "{script:git} {badge}{workspaces} {fg=accent}pane {pane}/{panes}{/} {fg=dim}{time}{/} "
tab            = " {index}·{name} {current_pane_glyph}{alert} "
tab_active     = "{fg=tab_active_fg,bg=tab_active_bg,bold} {index}·{name} {current_pane_id_glyph}{alert} {/}"
tab_sep        = " "
alert          = "{fg=accent,bold} ★{/}"
prefix         = "{fg=dim,bg=tab_bg} 🌴 {/}"
prefix_active  = "{fg=bg,bg=accent,bold} 🌴 {/}"
pane_id        = "{fg=tab_fg,bg=tab_bg} #{id} {/}"
pane_id_active = "{fg=tab_active_fg,bg=tab_active_bg,bold} #{id} {/}"
current_pane_glyphs         = ["⓪", "⓵", "⓶", "⓷", "⓸", "⓹", "⓺", "⓻", "⓼", "⓽"]
current_pane_zoom_glyphs    = ["⓿", "❶", "❷", "❸", "❹", "❺", "❻", "❼", "❽", "❾"]
current_pane_id_glyphs      = ["𝟎", "𝟏", "𝟐", "𝟑", "𝟒", "𝟓", "𝟔", "𝟕", "𝟖", "𝟗"]
current_pane_id_zoom_glyphs = ["⁰", "¹", "²", "³", "⁴", "⁵", "⁶", "⁷", "⁸", "⁹"]

[status.zoom_glyphs]
current_pane    = true
current_pane_id = true

[status.scripts.git]
command  = "git -C \"$SLAT_PANE_CWD\" branch --show-current 2>/dev/null | sed 's/.*/{fg=accent}✦ &{\\/}/'"
interval = "5s"
timeout  = "2s"
fallback = ""

[shortcuts]
"Alt+1" = "~/.config/slat/scripts/save-note.sh"

[keybinds]
split-vertical    = "v"
split-horizontal  = "h"
add-pane          = "a"
next-pane         = "o"
prev-pane         = "O"
select-pane-up    = "k"
select-pane-down  = "j"
select-pane-left  = "H"
select-pane-right = "L"
swap-pane         = "s"
move-mode         = "m"
move-pane-up      = "K"
move-pane-down    = "J"
move-pane-left    = "<"
move-pane-right   = ">"
resize-grow       = "+"
resize-shrink     = "-"
equalize          = "="
layout-picker     = "l"
close-pane        = "x"
zoom              = "z"
identify-panes    = "i"
stack-mode        = "t"
break-pane        = "!"
join-pane         = "@"
next-attention    = "A"
scroll-mode       = "["
new-tab           = "c"
next-tab          = "n"
prev-tab          = "p"
rename-tab        = ","
close-tab         = "X"
new-workspace     = "W"
next-workspace    = "w"
prev-workspace    = "P"
rename-workspace  = "$"
rename-session    = "S"
tree-picker       = "f"
session-picker    = "F"
next-session      = ")"
prev-session      = "("
global-tree       = "g"
save-session      = "E"
reload-config     = "r"
toggle-status-bar = "b"
detach            = "d"
quit              = "q"
