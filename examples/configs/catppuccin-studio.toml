# Catppuccin Studio — soft pastel palette, rounded borders, live git status,
# and zoomable pane/ID glyphs.
# Copy to ~/.config/slat/config.toml to use.

prefix      = "C-s"
status_bar  = true
auto_rename = true
mouse       = true
restore     = true
animations  = true

[animation]
split  = "110ms"
move   = "130ms"
easing = "out-back"
reveal = "curtain"
glyph  = "░"

[splash]
enabled  = true
duration = "600ms"
subtitle = "catppuccin studio · {version}"
hint     = "press {prefix} then ? for keys · {prefix} i for pane IDs"

[theme]
name = "catppuccin"

[borders]
style = "rounded"

[status]
left           = "{prefix} {fg=theme.background,bg=theme.accent,bold} {workspace} {/} {tabs}"
right          = "{script:git} {badge}{workspaces} {fg=theme.dim}pane {pane}/{panes}{/} {fg=theme.accent}{time}{/} "
tab            = " {tab_glyph} {index}:{name} {current_pane_glyph}{alert} "
tab_active     = "{fg=theme.tab_active_fg,bg=theme.tab_active_bg,bold} {tab_glyph} {index}:{name} {current_pane_id_glyph}{alert} {/}"
tab_sep        = " "
alert          = "{fg=red,bold} ●{/}"
prefix         = "{fg=theme.dim,bg=theme.tab_bg}  {/}"
prefix_active  = "{fg=theme.background,bg=theme.accent,bold} ⌘ {/}"
pane_id        = "{fg=theme.tab_fg,bg=theme.tab_bg} #{id} {/}"
pane_id_active = "{fg=theme.background,bg=theme.accent,bold} #{id} {/}"
tab_glyphs               = ["◆"]
tab_zoom_glyph           = "▣"
current_pane_glyphs         = ["₀", "₁", "₂", "₃", "₄", "₅", "₆", "₇", "₈", "₉"]
current_pane_zoom_glyphs    = ["⓿", "❶", "❷", "❸", "❹", "❺", "❻", "❼", "❽", "❾"]
current_pane_id_glyphs      = ["𝟘", "𝟙", "𝟚", "𝟛", "𝟜", "𝟝", "𝟞", "𝟟", "𝟠", "𝟡"]
current_pane_id_zoom_glyphs = ["𝟬", "𝟭", "𝟮", "𝟯", "𝟰", "𝟱", "𝟲", "𝟳", "𝟴", "𝟵"]

[status.zoom_glyphs]
tab             = true
current_pane    = true
current_pane_id = true

[status.scripts.git]
command  = "git -C \"$SLAT_PANE_CWD\" branch --show-current 2>/dev/null | sed 's/.*/{fg=accent}git:&{\\/}/'"
interval = "5s"
timeout  = "2s"
fallback = ""

[shortcuts]
"Alt+1" = "~/.config/slat/scripts/save-note.sh"

[keybinds]
split-vertical    = "v"
split-horizontal  = "h"
add-pane          = "a"
next-pane         = "o"
prev-pane         = "O"
select-pane-up    = "k"
select-pane-down  = "j"
select-pane-left  = "H"
select-pane-right = "L"
swap-pane         = "s"
move-mode         = "m"
move-pane-up      = "K"
move-pane-down    = "J"
move-pane-left    = "<"
move-pane-right   = ">"
resize-grow       = "+"
resize-shrink     = "-"
equalize          = "="
layout-picker     = "l"
close-pane        = "x"
zoom              = "z"
identify-panes    = "i"
stack-mode        = "t"
break-pane        = "!"
join-pane         = "@"
next-attention    = "A"
scroll-mode       = "["
new-tab           = "c"
next-tab          = "n"
prev-tab          = "p"
rename-tab        = ","
close-tab         = "X"
new-workspace     = "W"
next-workspace    = "w"
prev-workspace    = "P"
rename-workspace  = "$"
rename-session    = "S"
tree-picker       = "f"
session-picker    = "F"
next-session      = ")"
prev-session      = "("
global-tree       = "g"
save-session      = "E"
reload-config     = "r"
toggle-status-bar = "b"
detach            = "d"
quit              = "q"
