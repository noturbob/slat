# Tokyo Power — heavy borders, Unicode index & pane ID glyphs, live git status,
# and direct Alt+1 scripting.
# Copy to ~/.config/slat/config.toml to use.

prefix      = "C-s"
status_bar  = true
auto_rename = true
animations  = true

[animation]
split  = "90ms"
move   = "110ms"
easing = "out-cubic"

[theme]
name = "tokyo-night"

[borders]
style = "heavy"

[status]
left           = "{prefix}{fg=tab_active_fg,bg=tab_active_bg,bold} {session} {/} {fg=accent}{workspace}{/} │ {tabs}"
right          = "{script:git} {badge}{workspaces} {fg=pane}{current_pane_id_glyph}{/} {pane}/{panes} {fg=dim}{time}{/} "
tab            = " {tab_index_glyph} {name} {current_pane_glyph}{alert} "
tab_sep        = "{fg=border}│{/}"
alert          = "{fg=bright-red,bold} ●{/}"
prefix         = "{fg=fg,bg=tab_bg} · {/}"
prefix_active  = "{fg=bg,bg=accent,bold} ★ {/}"
pane_id        = "{fg=fg,bg=tab_bg} id:{id} {/}"
pane_id_active = "{fg=bg,bg=accent,bold} id:{id} {/}"
pane_colors    = ["cyan", "magenta", "yellow", "green"]
tab_index_glyphs            = ["0", "Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ", "Ⅴ", "Ⅵ", "Ⅶ", "Ⅷ", "Ⅸ"]
current_pane_glyphs         = ["⁰", "¹", "²", "³", "⁴", "⁵", "⁶", "⁷", "⁸", "⁹"]
current_pane_zoom_glyphs    = ["𝟎", "𝟏", "𝟐", "𝟑", "𝟒", "𝟓", "𝟔", "𝟕", "𝟖", "𝟗"]
current_pane_id_glyphs      = ["⓪", "①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨"]
current_pane_id_zoom_glyphs = ["⓿", "❶", "❷", "❸", "❹", "❺", "❻", "❼", "❽", "❾"]

[status.zoom_glyphs]
current_pane    = true
current_pane_id = true

[status.scripts.git]
command  = "git -C \"$SLAT_PANE_CWD\" branch --show-current 2>/dev/null | sed 's/.*/{fg=accent}[&]{\\/}/'"
interval = "5s"
timeout  = "2s"
fallback = ""

[shortcuts]
"Alt+1" = "~/.config/slat/scripts/save-note.sh"

[keybinds]
split-vertical    = "v"
split-horizontal  = "h"
add-pane          = "a"
next-pane         = "o"
prev-pane         = "O"
select-pane-up    = "k"
select-pane-down  = "j"
select-pane-left  = "H"
select-pane-right = "L"
swap-pane         = "s"
move-mode         = "m"
move-pane-up      = "K"
move-pane-down    = "J"
move-pane-left    = "<"
move-pane-right   = ">"
resize-grow       = "+"
resize-shrink     = "-"
equalize          = "="
layout-picker     = "l"
close-pane        = "x"
zoom              = "z"
identify-panes    = "i"
stack-mode        = "t"
break-pane        = "!"
join-pane         = "@"
next-attention    = "A"
scroll-mode       = "["
new-tab           = "c"
next-tab          = "n"
prev-tab          = "p"
rename-tab        = ","
close-tab         = "X"
new-workspace     = "W"
next-workspace    = "w"
prev-workspace    = "P"
rename-workspace  = "$"
rename-session    = "S"
tree-picker       = "f"
session-picker    = "F"
next-session      = ")"
prev-session      = "("
global-tree       = "g"
save-session      = "E"
reload-config     = "r"
toggle-status-bar = "b"
detach            = "d"
quit              = "q"
