# Publishes the website and the signed apt repository (/apt) to GitHub
# Pages. Repo settings: Pages → Source → "GitHub Actions".
#
# The site is a Next.js app in website/, built here from source: nothing
# generated is committed, which keeps minified bundles out of the source
# tree (and out of Debian's tarball).
name: pages

on:
  push:
    branches: [main]
    paths:
      ["website/**", "docs/**", "packaging/apt/**", ".github/workflows/pages.yml"]
  workflow_dispatch: # also started by release.yml after each release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the site
        working-directory: website
        run: |
          # The demo media lives in docs/ so the repository keeps one copy.
          cp ../docs/demo.gif ../docs/social-preview.png public/
          npm ci
          npm run build

      - name: Download .deb packages from the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for tag in $(gh release list --limit 3 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' --dir "debs/$tag"
          done

      - name: Build the site and the apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          cp -r website/out _site
          if ! find debs -name '*.deb' | grep -q .; then
            echo "No released .deb yet; publishing the site only."
            exit 0
          fi
          command -v apt-ftparchive || sudo apt-get install -y apt-utils
          export GNUPGHOME=$(mktemp -d)
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          packaging/apt/build-repo.sh debs _site/apt "$key"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
