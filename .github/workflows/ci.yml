name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the previous run pointless; don't leave it in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # A bounded timeout: a deadlock should fail with goroutine stacks in
      # minutes, not sit in the queue until the job is killed.
      - run: go test -race -timeout 5m ./...
      # Cross-compile the platforms this runner isn't, so a platform-only
      # file can't break a build that nothing here would notice.
      - run: GOOS=windows go vet ./... && GOOS=darwin go vet ./... && GOOS=linux go vet ./...
        if: matrix.os == 'ubuntu-latest'
