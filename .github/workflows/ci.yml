name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # Cross-compile the platforms this runner isn't, so a platform-only
      # file can't break a build that nothing here would notice.
      - run: GOOS=windows go vet ./... && GOOS=darwin go vet ./... && GOOS=linux go vet ./...
        if: matrix.os == 'ubuntu-latest'
