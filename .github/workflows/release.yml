name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write # to start the pages workflow, which publishes the apt repo
  packages: write # to push the container image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      # For the multi-arch container image on ghcr.io.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Releases made with GITHUB_TOKEN don't trigger other workflows, so
      # rebuild the apt repository explicitly.
      - run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
