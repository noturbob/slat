<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#14232a"/>
  <!-- blinds: faint slats across the whole card -->
  <g fill="#1b2e36">
    <rect y="40" width="1280" height="22"/><rect y="102" width="1280" height="22"/>
    <rect y="164" width="1280" height="22"/><rect y="226" width="1280" height="22"/>
    <rect y="288" width="1280" height="22"/><rect y="350" width="1280" height="22"/>
    <rect y="412" width="1280" height="22"/><rect y="474" width="1280" height="22"/>
    <rect y="536" width="1280" height="22"/>
  </g>
  <!-- logo mark -->
  <g transform="translate(96 96) scale(1.25)">
    <rect width="128" height="128" rx="28" fill="#0e1a1f"/>
    <rect x="24" y="28" width="56" height="12" rx="3" fill="#00d7d7"/>
    <rect x="86" y="28" width="18" height="12" rx="3" fill="#87d787"/>
    <rect x="24" y="48" width="44" height="12" rx="3" fill="#00d7d7" opacity=".85"/>
    <rect x="76" y="48" width="28" height="12" rx="3" fill="#00d7d7" opacity=".55"/>
    <rect x="24" y="68" width="44" height="12" rx="3" fill="#00d7d7" opacity=".7"/>
    <rect x="76" y="68" width="28" height="12" rx="3" fill="#00d7d7" opacity=".4"/>
    <rect x="24" y="88" width="44" height="12" rx="3" fill="#00d7d7" opacity=".55"/>
    <rect x="76" y="88" width="28" height="12" rx="3" fill="#00d7d7" opacity=".25"/>
  </g>
  <text x="96" y="370" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-weight="800" font-size="132" fill="#e9f0f0" letter-spacing="-4">slat</text>
  <text x="100" y="438" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-size="28" fill="#9fb6bd">Split your terminal.</text>
  <text x="100" y="476" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-size="28" fill="#9fb6bd">Keep it running when you leave.</text>
  <text x="100" y="566" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-size="24" fill="#00d7d7">github.com/noturbob/slat</text>
  <!-- a slat window: three panes and a status bar -->
  <g transform="translate(690 110) scale(0.9)" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-size="19">
    <rect width="560" height="448" rx="14" fill="#0e1a1f" stroke="#2c434c" stroke-width="2"/>
    <line x1="300" y1="16" x2="300" y2="400" stroke="#00d7d7" stroke-width="2"/>
    <line x1="300" y1="208" x2="544" y2="208" stroke="#3a4f57" stroke-width="2"/>
    <text x="22" y="46" fill="#87d787">~/api</text><text x="92" y="46" fill="#e9f0f0">❯ go test ./...</text>
    <text x="22" y="76" fill="#9fb6bd">ok  internal/vt</text>
    <text x="22" y="104" fill="#9fb6bd">ok  internal/app</text>
    <text x="22" y="132" fill="#9fb6bd">ok  internal/layout</text>
    <text x="22" y="170" fill="#87d787">~/api</text><text x="92" y="170" fill="#e9f0f0">❯</text>
    <rect x="114" y="154" width="11" height="21" fill="#00d7d7"/>
    <text x="320" y="46" fill="#e9f0f0">htop</text>
    <text x="320" y="76" fill="#87d787">CPU[|||||    34%]</text>
    <text x="320" y="104" fill="#00d7d7">Mem[|||   3.0G]</text>
    <text x="320" y="132" fill="#9fb6bd">Tasks: 92</text>
    <text x="320" y="246" fill="#87d787">~/web</text><text x="390" y="246" fill="#e9f0f0">❯ npm run dev</text>
    <text x="320" y="276" fill="#9fb6bd">ready on :3000</text>
    <rect x="2" y="410" width="556" height="36" fill="#262626"/>
    <text x="18" y="434" fill="#87d787" font-weight="700">main</text>
    <text x="80" y="434" fill="#6c7f86">│</text>
    <rect x="100" y="415" width="92" height="26" fill="#005faf"/>
    <text x="108" y="434" fill="#ffffff" font-weight="700">1:api</text>
    <text x="206" y="434" fill="#9fb6bd">2:web</text>
    <text x="452" y="434" fill="#9fb6bd">pane 1/3</text>
  </g>
</svg>
